name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-session-continuity:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx --test --test-force-exit --test-concurrency=1 test/core.test.ts test/gateway.test.ts test/update-channel.test.ts test/updater-security.test.ts

  selfhost-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-acceptance
          path: release/acceptance.json

  web-ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - if: github.event_name == 'pull_request'
        run: npm run test:web:smoke
      - if: github.event_name == 'pull_request'
        run: npm run test:web:selfhost -- --grep "@critical"
      - if: github.event_name != 'pull_request'
        run: npm run test:web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:binary
      - name: Install current local package twice
        run: node scripts/test-local-install.mjs

  node-24-lifecycle:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx --test test/cdp-lifecycle.test.ts
