name: Commit Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  pull-request-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]./_-]+\))?!?: .{1,72}$'
          printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern" || {
            printf 'Invalid PR title: %s\n' "$PR_TITLE" >&2
            exit 1
          }
