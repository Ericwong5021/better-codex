name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: write

concurrency:
  group: better-codex-release
  queue: max
  cancel-in-progress: false

jobs:
  verify-candidate:
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Validate release version and changelog
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          core_version="$(node -e "const source=require('fs').readFileSync('src/version.ts','utf8'); const match=source.match(/export const coreVersion = \"([^\"]+)\"/); process.stdout.write(match?.[1] || '')")"
          expected_tag="v$version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Package version %s is not a release version.\n' "$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            printf 'Release tag %s does not match package version %s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [ "$lock_version" != "$version" ] || [ "$core_version" != "$version" ]; then
            printf 'Version mismatch: package=%s lock=%s core=%s.\n' "$version" "$lock_version" "$core_version" >&2
            exit 1
          fi
          escaped_version="${version//./\\.}"
          heading_count="$(grep -Ec "^## \\[$escaped_version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)"
          if [ "$heading_count" != "1" ]; then
            printf 'CHANGELOG.md must contain exactly one dated section for version %s.\n' "$version" >&2
            exit 1
          fi
          entry_count="$(awk -v heading="## [$version] - " '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && /^- / { count += 1 }
            END { print count + 0 }
          ' CHANGELOG.md)"
          if [ "$entry_count" -lt "1" ]; then
            printf 'CHANGELOG.md must contain at least one change for version %s.\n' "$version" >&2
            exit 1
          fi
          link_count="$(grep -Fc "[$version]:" CHANGELOG.md || true)"
          if [ "$link_count" != "1" ]; then
            printf 'CHANGELOG.md must contain exactly one link for version %s.\n' "$version" >&2
            exit 1
          fi
          if ! grep -Fq "compare/$expected_tag...HEAD" CHANGELOG.md; then
            printf 'The Unreleased changelog link must start after %s.\n' "$expected_tag" >&2
            exit 1
          fi

  package:
    needs: [validate-release, verify-candidate]
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Prepare Apple signing and notarization
        id: macos-signing
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-signing
        with:
          # Explicitly authorized exceptions for these releases only; future releases remain strict.
          allow-ad-hoc: ${{ github.ref_name == 'v0.4.18' || github.ref_name == 'v0.4.19' }}
          certificate: ${{ secrets.BETTER_CODEX_MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.BETTER_CODEX_MACOS_CERTIFICATE_PASSWORD }}
          api-key: ${{ secrets.BETTER_CODEX_MACOS_NOTARY_API_KEY }}
          key-id: ${{ secrets.BETTER_CODEX_MACOS_NOTARY_KEY_ID }}
          issuer-id: ${{ secrets.BETTER_CODEX_MACOS_NOTARY_ISSUER_ID }}
      - run: npm run package:binary
      - name: Record macOS distribution status
        if: runner.os == 'macOS'
        env:
          SIGNING_MODE: ${{ steps.macos-signing.outputs.signing-mode }}
          PACKAGE_RUNNER: ${{ matrix.runner }}
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const mode = process.env.SIGNING_MODE; if (!["ad-hoc-unnotarized", "developer-id-notarized"].includes(mode)) throw new Error("macos_distribution_status_missing"); fs.writeFileSync(`release/macos-distribution-${process.env.PACKAGE_RUNNER}.json`, JSON.stringify({ runner: process.env.PACKAGE_RUNNER, signingMode: mode }));'
      - name: Remove temporary signing identity
        if: always() && runner.os == 'macOS' && env.BETTER_CODEX_MACOS_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$BETTER_CODEX_MACOS_KEYCHAIN"
      - name: Install current local package twice
        run: node scripts/test-local-install.mjs
      - name: Verify the macOS DMG in an isolated home
        if: runner.os == 'macOS'
        run: npm run test:macos-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: better-codex-${{ matrix.runner }}
          path: |
            release/better-codex-cli-*
            release/better-codex-core-*
            release/better-codex-*.dmg
            release/macos-distribution-*.json

  release:
    needs:
      - package
      - verify-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --force
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cp scripts/install.sh scripts/install.ps1 scripts/selfhost.sh SELF_HOSTING.md release/
      - run: git rev-parse HEAD > release/source-commit.txt
      - run: find release -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name 'selfhost.sh' -o -name 'SELF_HOSTING.md' -o -name 'source-commit.txt' \) -exec sha256sum {} \; | sed 's#release/##' > release/checksums.txt
      - env:
          BETTER_CODEX_UPDATE_PRIVATE_KEY: ${{ secrets.BETTER_CODEX_UPDATE_PRIVATE_KEY }}
        run: npm run package:update-manifest
      - name: Prepare the promoted Preview feed before publishing
        env:
          BETTER_CODEX_UPDATE_CHANNEL: preview
          BETTER_CODEX_UPDATE_PRIVATE_KEY: ${{ secrets.BETTER_CODEX_UPDATE_PRIVATE_KEY }}
        run: |
          cp -a release preview-release
          node scripts/create-update-manifest.mjs preview-release
          node scripts/preview-feed.mjs verify-channel stable release/update-manifest.json assets/update-public-key.pem
          node scripts/preview-feed.mjs verify-channel preview preview-release/update-manifest.json assets/update-public-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: preview-feed-manifest
          path: preview-release/update-manifest.json
      - name: Publish versioned stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/better-codex-release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -f target_commitish="$GITHUB_SHA" --jq .body > "$notes"
          node - "$notes" <<'NODE'
          const fs = require('node:fs');
          const runners = ['macos-15', 'macos-15-intel'];
          const statuses = runners.map(runner => {
            const status = JSON.parse(fs.readFileSync(`release/macos-distribution-${runner}.json`, 'utf8'));
            if (status.runner !== runner || !['ad-hoc-unnotarized', 'developer-id-notarized'].includes(status.signingMode)) throw new Error('macos_distribution_status_invalid');
            if (status.signingMode === 'ad-hoc-unnotarized' && !['v0.4.18', 'v0.4.19'].includes(process.env.GITHUB_REF_NAME)) throw new Error('macos_unnotarized_release_not_authorized');
            return `${runner === 'macos-15' ? 'Apple Silicon' : 'Intel'}: ${status.signingMode === 'ad-hoc-unnotarized' ? 'ad-hoc signed DMG; not notarized by Apple. macOS may require explicit approval to open it.' : 'Developer ID signed and notarized by Apple.'}`;
          });
          fs.appendFileSync(process.argv[2], `\n\n### macOS distribution\n\n${statuses.map(status => `- ${status}`).join('\n')}\n\nThe Better Codex update manifest and checksums are cryptographically signed independently of Apple signing and notarization.\n`);
          NODE
          assets=(release/better-codex-cli-* release/better-codex-core-* release/better-codex-*.dmg release/better-codex-compatibility-*.json release/checksums.txt release/checksums.sig release/install.ps1 release/install.sh release/selfhost.sh release/SELF_HOSTING.md release/source-commit.txt release/update-manifest.json release/update-public-key.pem)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')" = "${GITHUB_REF_NAME}"$'\tfalse\tfalse'
            for path in "${assets[@]}"; do
              name="$(basename "$path")"
              if ! gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release upload "${GITHUB_REF_NAME}" "$path"
              fi
            done
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --notes-file "$notes" --verify-tag
          fi
          for path in "${assets[@]}"; do
            name="$(basename "$path")"
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done

  refresh-preview-feed:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-feed-manifest
          path: preview-feed
      - name: Advance the signed Preview feed monotonically
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/promote-preview-feed.sh preview-feed/update-manifest.json

  update-homebrew-formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "${GITHUB_REF_NAME}" --pattern '*.tar.gz' --dir release
      - run: git fetch origin main && git checkout -B main origin/main
      - name: Refuse to downgrade the Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^  version "\([0-9][0-9.]*\)"$/\1/p' Formula/better-codex.rb)"
          next="${GITHUB_REF_NAME#v}"
          node -e '
            const [current, next] = process.argv.slice(1);
            const parts = value => value.split(".").map(Number);
            const left = parts(current);
            const right = parts(next);
            const comparison = left.findIndex((value, index) => value !== right[index]);
            if (comparison >= 0 && left[comparison] > right[comparison]) {
              console.error(`Refusing to downgrade Homebrew formula from ${current} to ${next}.`);
              process.exit(1);
            }
          ' "$current" "$next"
      - run: sha256sum release/*.tar.gz | sed 's#release/##' > release/checksums.txt
      - run: node scripts/render-homebrew-formula.mjs --version "${GITHUB_REF_NAME#v}" --checksums release/checksums.txt --output Formula/better-codex.rb
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/better-codex.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git commit -m "chore(release): better-codex ${GITHUB_REF_NAME#v}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
