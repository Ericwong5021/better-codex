name: Fix issue 16

on:
  push:
    branches:
      - fix/issue-16-native-icon-size

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source fix and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("src/ui/injected-entry.ts")
          source = source_path.read_text()

          old_css = '        .better-codex-native-navigation svg { width: var(--bc-space-4); height: var(--bc-space-4); flex-shrink: 0; }'
          new_css = '        .better-codex-native-navigation svg { width: var(--better-codex-native-icon-width, var(--bc-space-4)); height: var(--better-codex-native-icon-height, var(--bc-space-4)); flex-shrink: 0; }'
          if old_css in source:
              source = replace_once(source, old_css, new_css, "native icon css")
          elif new_css not in source:
              raise SystemExit("native icon css: neither old nor expected new form was found")

          native_button_marker = '    function nativeButton(text) {\n'
          helper = '''    function syncNativeIconSize(button, reference) {
              if (HOST_KIND === "web" || !reference) return;
              const referenceIcon = reference.querySelector("svg");
              if (!(referenceIcon instanceof SVGElement)) return;
              const style = getComputedStyle(referenceIcon);
              const width = Number.parseFloat(style.width) > 0 ? style.width : "";
              const height = Number.parseFloat(style.height) > 0 ? style.height : "";
              if (width) button.style.setProperty("--better-codex-native-icon-width", width);
              if (height) button.style.setProperty("--better-codex-native-icon-height", height);
            }

          '''
          if 'function syncNativeIconSize(button, reference)' not in source:
              source = replace_once(source, native_button_marker, helper + native_button_marker, "native icon helper insertion")

          old_sync_call = '''        button.style.font = style.font;
              button.style.gap = style.gap;
            }
            return button;
          '''
          new_sync_call = '''        button.style.font = style.font;
              button.style.gap = style.gap;
              syncNativeIconSize(button, reference);
            }
            return button;
          '''
          if 'syncNativeIconSize(button, reference);' not in source:
              source = replace_once(source, old_sync_call, new_sync_call, "native icon sync call")

          source_path.write_text(source)

          test_path = Path("test/web.test.ts")
          test_source = test_path.read_text()
          old_assertions = '''    assert.match(source, /className = HOST_KIND === "web" \\? "web-nav-button" : "better-codex-native-navigation"/);
              assert.match(source, /\\.prepend\\(entry\\)/);
          '''
          new_assertions = '''    assert.match(source, /className = HOST_KIND === "web" \\? "web-nav-button" : "better-codex-native-navigation"/);
              assert.match(source, /--better-codex-native-icon-width/);
              assert.match(source, /--better-codex-native-icon-height/);
              assert.match(source, /const referenceIcon = reference\\.querySelector\\("svg"\\)/);
              assert.match(source, /button\\.style\\.gap = style\\.gap;[\\s\\S]*syncNativeIconSize\\(button, reference\\)/);
              assert.match(source, /\\.prepend\\(entry\\)/);
          '''
          if '--better-codex-native-icon-width/' not in test_source:
              test_source = replace_once(test_source, old_assertions, new_assertions, "native icon regression assertions")
          test_path.write_text(test_source)
          PY

      - name: Regenerate injected UI
        run: npm run build:injected-ui

      - name: Run tests
        run: npm test

      - name: Run type and repository checks
        run: npm run check

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-issue-16.yml
          git add -A
          git commit -m "fix(sidebar): match native icon size"
          git push origin HEAD
