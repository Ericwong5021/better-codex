name: Preview

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: better-codex-release
  queue: max
  cancel-in-progress: false

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Validate Beta version and changelog
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          core_version="$(node -e "const source=require('fs').readFileSync('src/compatibility.ts','utf8'); const match=source.match(/export const coreVersion = \"([^\"]+)\"/); process.stdout.write(match?.[1] || '')")"
          expected_tag="v$version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            printf 'Package version %s is not a Beta version.\n' "$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            printf 'Preview tag %s does not match package version %s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [ "$lock_version" != "$version" ] || [ "$core_version" != "$version" ]; then
            printf 'Version mismatch: package=%s lock=%s core=%s.\n' "$version" "$lock_version" "$core_version" >&2
            exit 1
          fi
          heading="## [$version] - "
          heading_count="$(grep -Fc "$heading" CHANGELOG.md || true)"
          if [ "$heading_count" != "1" ]; then
            printf 'CHANGELOG.md must contain exactly one dated section for version %s.\n' "$version" >&2
            exit 1
          fi
          entry_count="$(awk -v heading="$heading" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && /^- / { count += 1 }
            END { print count + 0 }
          ' CHANGELOG.md)"
          if [ "$entry_count" -lt "1" ]; then
            printf 'CHANGELOG.md must contain at least one change for version %s.\n' "$version" >&2
            exit 1
          fi
          if [ "$(grep -Fc "[$version]:" CHANGELOG.md || true)" != "1" ]; then
            printf 'CHANGELOG.md must contain exactly one link for version %s.\n' "$version" >&2
            exit 1
          fi
          if ! grep -Fq "compare/$expected_tag...HEAD" CHANGELOG.md; then
            printf 'The Unreleased changelog link must start after %s.\n' "$expected_tag" >&2
            exit 1
          fi
          stable_tag="$(gh release view --json tagName --jq .tagName)"
          node scripts/preview-feed.mjs newer "$version" "${stable_tag#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: validate-preview
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:binary
        env:
          BETTER_CODEX_REQUIRE_SIGNING: "0"
      - name: Install current local package twice
        run: node scripts/test-local-install.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: better-codex-${{ matrix.runner }}
          path: |
            release/better-codex-core-*

  release-preview:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --force
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create signed Preview manifest
        env:
          BETTER_CODEX_UPDATE_CHANNEL: preview
          BETTER_CODEX_UPDATE_PRIVATE_KEY: ${{ secrets.BETTER_CODEX_UPDATE_PRIVATE_KEY }}
        run: npm run package:update-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: preview-feed-manifest
          path: release/update-manifest.json
      - name: Publish versioned Beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/better-codex-core-* release/better-codex-compatibility-*.json release/update-manifest.json)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')" = "${GITHUB_REF_NAME}"$'\tfalse\ttrue'
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --prerelease --latest=false --generate-notes --verify-tag
          fi
          for path in "${assets[@]}"; do
            name="$(basename "$path")"
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done

  refresh-preview-feed:
    needs: release-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-feed-manifest
          path: preview-feed
      - name: Advance the signed Preview feed monotonically
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/promote-preview-feed.sh preview-feed/update-manifest.json
