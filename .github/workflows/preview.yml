name: Preview

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: better-codex-release
  queue: max
  cancel-in-progress: false

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Validate Beta version and changelog
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/release-beta.mjs check "$version" --tag "$GITHUB_REF_NAME"
          stable_tag="$(gh release view --json tagName --jq .tagName)"
          node scripts/preview-feed.mjs newer "$version" "${stable_tag#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  acceptance:
    needs: validate-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-acceptance
          path: release/acceptance.json

  package:
    needs: acceptance
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:binary
      - name: Install current local package twice
        run: node scripts/test-local-install.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: better-codex-${{ matrix.runner }}
          path: |
            release/better-codex-cli-*
            release/better-codex-core-*

  release-preview:
    needs:
      - package
      - acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --force
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cp scripts/install.sh scripts/install.ps1 release/
      - run: find release -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; | sed 's#release/##' > release/checksums.txt
      - name: Create signed Preview manifest
        env:
          BETTER_CODEX_UPDATE_CHANNEL: preview
          BETTER_CODEX_UPDATE_PRIVATE_KEY: ${{ secrets.BETTER_CODEX_UPDATE_PRIVATE_KEY }}
        run: npm run package:update-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: preview-feed-manifest
          path: release/update-manifest.json
      - name: Publish versioned Beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/better-codex-cli-* release/better-codex-core-* release/better-codex-compatibility-*.json release/acceptance.json release/checksums.txt release/checksums.sig release/install.ps1 release/install.sh release/update-manifest.json release/update-public-key.pem)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')" = "${GITHUB_REF_NAME}"$'\tfalse\ttrue'
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --prerelease --latest=false --generate-notes --verify-tag
          fi
          for path in "${assets[@]}"; do
            name="$(basename "$path")"
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done

  refresh-preview-feed:
    needs: release-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-feed-manifest
          path: preview-feed
      - name: Advance the signed Preview feed monotonically
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/promote-preview-feed.sh preview-feed/update-manifest.json
